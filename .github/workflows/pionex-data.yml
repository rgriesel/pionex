name: pionex-public-data

# Probes Pionex PUBLIC market-data endpoints, backfills candles, and runs one walk-forward
# research cycle on real data. No credentials, no order endpoints, no paper engine (CI is not a
# persistent host). Runs on a schedule (Monday: 1-hour strategies, Thursday: 5-minute strategies)
# and on demand. The research registry is carried between runs in the Actions cache so the
# mandate's one-cycle-per-UTC-day search budget and the full trial history hold across runs.
on:
  schedule:
    - cron: "37 0 * * 1"   # Monday 00:37 UTC: 1-hour strategies
    - cron: "37 0 * * 4"   # Thursday 00:37 UTC: 5-minute strategies
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Strategy timeframe: 5m (5-minute candles) or 1h (1-hour candles)"
        type: choice
        options: ["5m", "1h"]
        default: "5m"
      backfill_days:
        description: "Days of history to backfill (Pionex serves ~35 days of 5m, ~417 days of 1h)"
        default: "420"
      run_research:
        description: "Run one research cycle after backfill"
        type: boolean
        default: true

concurrency:
  group: pionex-public-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # to recover the research registry from the previous run's artifact

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runtime state directory and run settings
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TIMEFRAME: ${{ inputs.timeframe }}
          IN_DAYS: ${{ inputs.backfill_days }}
          IN_RESEARCH: ${{ inputs.run_research }}
        run: |
          echo "PIONEX_LAB_VAR=$RUNNER_TEMP/var" >> "$GITHUB_ENV"
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in "37 0 * * 1") TF=1h ;; *) TF=5m ;; esac
            DAYS=420; RESEARCH=true
          else
            TF="$IN_TIMEFRAME"; DAYS="$IN_DAYS"; RESEARCH="$IN_RESEARCH"
          fi
          echo "TIMEFRAME=$TF" >> "$GITHUB_ENV"
          echo "BACKFILL_DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "RUN_RESEARCH=$RESEARCH" >> "$GITHUB_ENV"
          echo "event=$EVENT timeframe=$TF backfill_days=$DAYS research=$RESEARCH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore research registry
        id: registry
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/var/research.db
          key: research-registry-${{ github.run_id }}
          restore-keys: research-registry-
      # Caches are scoped to branches and evicted after 7 idle days. Without a cache, carry the full
      # trial history forward from the newest successful run's artifact instead of starting empty.
      - name: Recover research registry from the previous run
        if: ${{ steps.registry.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pionex-data.yml --status success \
                   --limit 20 --json databaseId --jq '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" | head -1 || true)
          if [ -n "$prev" ] && gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name pionex-public-data \
                                 --dir "$RUNNER_TEMP/previous" && [ -f "$RUNNER_TEMP/previous/research.db" ]; then
            mkdir -p "$PIONEX_LAB_VAR"
            cp "$RUNNER_TEMP/previous/research.db" "$PIONEX_LAB_VAR/research.db"
            echo "Research registry recovered from run $prev" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous research registry found; starting a new one" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Initialise runtime state
        run: python -m pionex_lab init
      - name: Capability probe (public endpoints)
        run: python -m pionex_lab capability
      - name: Backfill candles
        run: python -m pionex_lab collect --backfill-only --backfill-days "$BACKFILL_DAYS"
      - name: Data summary
        run: python -m pionex_lab status
      - name: Research cycle
        if: ${{ env.RUN_RESEARCH == 'true' }}
        run: |
          python -m pionex_lab research --timeframe "$TIMEFRAME" --note "CI public-data cycle ($GITHUB_EVENT_NAME)" \
            | tee "$RUNNER_TEMP/research.out"
          python - "$RUNNER_TEMP/research.out" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().splitlines()
          print("## Research cycle\n")
          print("\n".join(l for l in lines if not l.startswith("{")) + "\n")
          rows = [json.loads(l) for l in lines if l.startswith("{")]
          if rows:
              print("| Strategy | Status | OOS trades | Net / trade (bps) | Failed gates |")
              print("|---|---|---:|---:|---|")
              for r in rows:
                  e = r.get("expectancy_bps")
                  print(f"| {r['strategy']} | {r['status']} | {r.get('oos_trades', '')} | "
                        f"{'' if e is None else f'{e:.1f}'} | {', '.join(r.get('failed_gates') or []) or '-'} |")
          PY
      - name: Save research registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/var/research.db
          key: research-registry-${{ github.run_id }}
      - name: Export report snapshot
        if: always()
        run: |
          python -m pionex_lab report --out "$PIONEX_LAB_VAR/report.json" || true
          echo "----- report.json -----"
          cat "$PIONEX_LAB_VAR/report.json" || true
      - name: Remove dashboard token before upload
        if: always()
        run: rm -f "$PIONEX_LAB_VAR/dashboard.token"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pionex-public-data
          path: |
            ${{ runner.temp }}/var/capability
            ${{ runner.temp }}/var/research.db
            ${{ runner.temp }}/var/report.json
          retention-days: 30
