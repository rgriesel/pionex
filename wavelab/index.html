<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave Lab</title>
<style>
:root{--bg:#0e1117;--panel:#151a23;--panel2:#1b2230;--border:#283142;--text:#d8deea;--muted:#8792a6;--accent:#4c8dff;
--up:#26a69a;--down:#ef5350;--grid:#1a212d;--cross:#8f9ab0;--warn:#ffb74d;--bad:#ef5350;--good:#26a69a;
--deg-minor:#4fc3f7;--deg-intermediate:#ffb74d;--deg-primary:#f06292;--alt:#9e9e9e;--fib:#b39ddb;--target:#66bb6a;--level:#78909c;--draw:#4c8dff;--alert:#ffa726}
:root{color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f3f5f9;--panel:#fff;--panel2:#eef1f6;--border:#d6dce6;--text:#1b2332;--muted:#667085;--grid:#edf0f5;--cross:#6b7588;
--deg-minor:#0288d1;--deg-intermediate:#ef6c00;--deg-primary:#c2185b;--alt:#8a8a8a;--fib:#7e57c2;--target:#2e7d32;--level:#607d8b}}
:root[data-theme=light]{color-scheme:light;--bg:#f3f5f9;--panel:#fff;--panel2:#eef1f6;--border:#d6dce6;--text:#1b2332;--muted:#667085;--grid:#edf0f5;--cross:#6b7588;
--deg-minor:#0288d1;--deg-intermediate:#ef6c00;--deg-primary:#c2185b;--alt:#8a8a8a;--fib:#7e57c2;--target:#2e7d32;--level:#607d8b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
select,input{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:4px 6px}
input[type=checkbox]{padding:0}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--border)}
header button,header .badge,header select{white-space:nowrap;flex:none}
header .logo{font-weight:700;white-space:nowrap;letter-spacing:.3px;margin-right:6px}
header .logo span{color:var(--accent)}
.grp{display:flex;gap:2px;align-items:center}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid var(--border)}
.badge.demo{background:#b71c1c;color:#fff;border-color:#b71c1c}
.badge.live{background:var(--panel2)}
.spacer{flex:1}
#body{display:grid;grid-template-columns:42px 1fr 360px;min-height:0}
#body.nosb{grid-template-columns:42px 1fr 0}
#tools{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;padding:5px 4px;overflow:auto}
#tools button{width:32px;height:30px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
#tools .tsep{height:1px;background:var(--border);margin:3px 0}
#grid{display:grid;gap:3px;background:var(--border);min-height:0;min-width:0}
.pane{position:relative;background:var(--bg);min-height:0;min-width:0;outline:2px solid transparent}
.pane.active{outline-color:var(--accent);outline-offset:-2px}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.pane .ptitle{position:absolute;left:8px;top:6px;z-index:2;display:flex;gap:6px;align-items:center;pointer-events:none}
.pane .ptitle b{font-size:14px}
.pane .ptitle .pi{pointer-events:auto;font-size:11px;padding:1px 5px}
.pane .legend{position:absolute;left:8px;top:28px;z-index:2;font-size:11px;color:var(--muted);pointer-events:none;white-space:pre}
.pane .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:transparent}
.tabbody{flex:1;overflow:auto;padding:8px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 3px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);padding:0 4px}
.x:hover{color:var(--bad)}
h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.card{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.ok::before{content:"\2713  ";color:var(--good);font-weight:700}
.no::before{content:"\2717  ";color:var(--bad);font-weight:700}
.bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}
footer{display:flex;gap:12px;padding:3px 10px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:50;padding-top:8vh}
.modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--border);border-radius:8px;width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0007}
.dlg .hd{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600}
.dlg .bd{padding:10px 12px;overflow:auto}
.dlg .hd .x{margin-left:auto;font-size:18px}
.list div{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between}
.list div:hover,.list div.hl{background:var(--panel2)}
#toasts{position:fixed;right:14px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--panel);border:1px solid var(--alert);border-left:4px solid var(--alert);border-radius:6px;padding:8px 12px;min-width:260px;box-shadow:0 6px 20px #0006}
.toast b{display:block;margin-bottom:2px}
#ctx{position:fixed;display:none;background:var(--panel);border:1px solid var(--border);border-radius:6px;z-index:70;min-width:200px;box-shadow:0 6px 20px #0006}
#ctx div{padding:7px 12px;cursor:pointer}
#ctx div:hover{background:var(--panel2)}
.menu{position:relative}
.menu .drop{position:absolute;top:110%;left:0;display:none;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;z-index:40;min-width:240px;box-shadow:0 6px 20px #0006}
.menu.open .drop{display:block}
.drop label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.spark{vertical-align:middle}
.small{font-size:11px}
.hosted .notify-opt{display:none}
@media (max-width:900px){#body{grid-template-columns:42px 1fr 0}#body.sbm{grid-template-columns:42px 0 1fr}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">Wave<span>Lab</span></div>
  <button id="symBtn" title="Change symbol (or just start typing)">BTC_USDT &#9662;</button>
  <div class="grp" id="ivBtns"></div>
  <div class="sep"></div>
  <select id="styleSel" title="Chart style">
    <option value="candles">Candles</option><option value="hollow">Hollow candles</option>
    <option value="ha">Heikin Ashi</option><option value="ohlc">OHLC bars</option><option value="line">Line</option>
    <option value="area">Area</option><option value="step">Step line</option><option value="baseline">Baseline</option>
  </select>
  <button id="indBtn" title="Indicators">&#402;x Indicators</button>
  <div class="menu" id="waveMenu"><button id="waveBtn" title="Automatic wave analysis">&#8767; Waves &#9662;</button>
    <div class="drop">
      <label><input type="checkbox" data-w="waves"> Automatic wave count</label>
      <label><input type="checkbox" data-w="alternates"> Alternate counts</label>
      <label><input type="checkbox" data-w="history"> Earlier completed patterns</label>
      <label><input type="checkbox" data-w="targets"> Fibonacci targets &amp; invalidation</label>
      <label><input type="checkbox" data-w="box"> Target box (projected end zone: price &amp; time)</label>
      <label><input type="checkbox" data-w="fibs"> Smart Fibs (hover a wave label)</label>
      <label><input type="checkbox" data-w="channels"> Elliott channels</label>
      <label><input type="checkbox" data-w="levels"> Smart support / resistance</label>
      <label><input type="checkbox" data-w="pivots"> Swing pivots</label>
      <div class="row" style="margin-top:6px">Degree
        <select id="degSel"><option value="minor">Minor</option><option value="intermediate">Intermediate</option><option value="primary">Primary</option></select>
      </div>
      <div class="row">Swing % <input id="pctIn" type="number" step="0.1" min="0.1" max="50" placeholder="auto" style="width:80px"></div>
      <div class="small muted">Counts are pattern hypotheses, not forecasts.</div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="grp" id="layoutBtns" title="Chart layout">
    <button data-l="1">&#9634;</button><button data-l="2">&#9707;</button><button data-l="2v">&#9636;</button><button data-l="4">&#8862;</button>
  </div>
  <button id="linkBtn" title="Link symbol across charts">&#128279;</button>
  <button id="logBtn" title="Logarithmic price scale">Log</button>
  <button id="magBtn" title="Magnet: snap drawings to OHLC">&#129522;</button>
  <button id="shotBtn" title="Save chart as PNG">&#128247;</button>
  <div class="spacer"></div>
  <span id="feedBadge" class="badge live" style="max-width:260px;overflow:hidden;text-overflow:ellipsis">&hellip;</span>
    <button id="themeBtn" title="Light / dark">&#9681;</button>
  <button id="sbBtn" title="Toggle side panel">&#9776;</button>
</header>
<div id="body">
  <div id="tools"></div>
  <div id="grid"></div>
  <aside>
    <div class="tabs" id="tabs">
      <button data-t="watch" class="on">Watchlist</button><button data-t="scan">Scanner</button>
      <button data-t="alerts">Alerts</button><button data-t="count">Count</button>
    </div>
    <div class="tabbody" id="tab-watch"></div>
    <div class="tabbody" id="tab-scan" hidden></div>
    <div class="tabbody" id="tab-alerts" hidden></div>
    <div class="tabbody" id="tab-count" hidden></div>
  </aside>
</div>
<footer><span id="status">Starting&hellip;</span><span class="spacer"></span>
  <span>Read-only analysis. Wave counts are pattern hypotheses, not forecasts, signals, or evidence of profitability. Wave Lab cannot place orders.</span></footer>
</div>

<div class="modal" id="symModal"><div class="dlg"><div class="hd">Symbol search<button class="x" data-close>&times;</button></div>
  <div class="bd"><input id="symQ" placeholder="Type to search, e.g. ETH" style="width:100%;margin-bottom:8px" autocomplete="off">
  <div class="list" id="symList"></div></div></div></div>
<div class="modal" id="indModal"><div class="dlg"><div class="hd">Indicators<button class="x" data-close>&times;</button></div>
  <div class="bd"><h4 style="margin-top:0">Active on this chart</h4><div id="indActive"></div>
  <h4>Add</h4><input id="indQ" placeholder="Filter" style="width:100%;margin-bottom:6px"><div class="list" id="indList"></div></div></div></div>
<div class="modal" id="alertModal"><div class="dlg"><div class="hd">Create alert<button class="x" data-close>&times;</button></div>
  <div class="bd" id="alertForm"></div></div></div>
<div class="modal" id="askModal"><div class="dlg" style="width:min(420px,94vw)"><div class="hd" id="askTitle">Confirm<button class="x" data-close>&times;</button></div>
  <form class="bd" id="askForm"><input id="askInput" style="width:100%;margin-bottom:10px" maxlength="200" autocomplete="off">
  <div class="row" style="margin:0"><span class="spacer"></span><button type="button" data-close>Cancel</button><button type="submit" class="on" id="askOk">OK</button></div></form></div></div>
<div id="ctx"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================ utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NaNs = n => new Array(n).fill(NaN);
const fin = v => typeof v === "number" && isFinite(v);
const store = {
  get(k, d) { try { const v = localStorage.getItem("wavelab." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("wavelab." + k, JSON.stringify(v)); } catch (e) {} }
};
function decimals(p) { if (!fin(p) || p <= 0) return 2; return Math.max(2, Math.min(8, 4 - Math.floor(Math.log10(p)))); }
const fmtP = (p, ref) => fin(p) ? p.toFixed(decimals(ref ?? p)) : "–";
const fmtPct = v => fin(v) ? (v >= 0 ? "+" : "") + v.toFixed(2) + "%" : "–";
const fmtVol = v => !fin(v) ? "–" : v >= 1e9 ? (v/1e9).toFixed(2)+"B" : v >= 1e6 ? (v/1e6).toFixed(2)+"M" : v >= 1e3 ? (v/1e3).toFixed(1)+"K" : v.toFixed(2);
const IV_MS = {"1M":6e4,"5M":3e5,"15M":9e5,"30M":18e5,"60M":36e5,"4H":144e5,"8H":288e5,"12H":432e5,"1D":864e5};
const IV_LABEL = {"1M":"1m","5M":"5m","15M":"15m","30M":"30m","60M":"1H","4H":"4H","8H":"8H","12H":"12H","1D":"D"};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2, "0");
function fmtTime(t, iv, full) {
  const d = new Date(t);
  const day = `${MON[d.getMonth()]} ${d.getDate()}`;
  if (full) return `${d.getFullYear()} ${day} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return IV_MS[iv] >= 864e5 ? day : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
const HEAT = {};   // liquidation heatmap cache: key -> {at, loading, data}
function loadHeat(key, symbol, p) {
  const prev = HEAT[key]; HEAT[key] = {at: Date.now(), loading: true, data: prev && prev.data};
  api(`/api/heatmap?symbol=${encodeURIComponent(symbol)}&range=${encodeURIComponent(p.range)}&model=${encodeURIComponent(p.model)}&lev=${encodeURIComponent(p.lev)}`)
    .then(d => { HEAT[key] = {at: Date.now(), data: d}; redrawAll(); })
    .catch(e => { HEAT[key] = {at: Date.now(), data: {available: false, note: String(e.message || e)}}; redrawAll(); });
}
const HEAT_STOPS = [[0, [59, 15, 112]], [0.45, [33, 145, 140]], [0.75, [94, 201, 98]], [1, [253, 231, 37]]];
function heatColor(t) {
  for (let k = 1; k < HEAT_STOPS.length; k++) { const [t1, c1] = HEAT_STOPS[k], [t0, c0] = HEAT_STOPS[k - 1];
    if (t <= t1) { const f = (t - t0) / (t1 - t0); return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f)).join(",")})`; } }
  return "rgb(253,231,37)";
}
const fmtUsd = v => !fin(v) ? "-" : v >= 1e9 ? "$" + (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? "$" + (v / 1e3).toFixed(0) + "K" : "$" + Math.round(v);
async function api(path) {
  if (window.WaveEngine) return window.WaveEngine.route(path);  // hosted build: no server
  const r = await fetch(path, {cache: "no-store"});
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setStatus(s) { $("#status").textContent = s; }

/* ============================================================ indicator math */
const TA = {
  sma(x, n) { const o = NaNs(x.length); let s = 0, k = 0; for (let i = 0; i < x.length; i++) { s += x[i]; k++; if (i >= n) s -= x[i-n]; if (i >= n-1) o[i] = s / n; } return o; },
  ema(x, n) { const o = NaNs(x.length), a = 2/(n+1); let p = NaN, s = 0, c = 0;
    for (let i = 0; i < x.length; i++) { const v = x[i]; if (!fin(v)) continue; if (!fin(p)) { s += v; c++; if (c === n) { p = s/n; o[i] = p; } } else { p = v*a + p*(1-a); o[i] = p; } } return o; },
  rma(x, n) { const o = NaNs(x.length); let p = NaN, s = 0, c = 0;
    for (let i = 0; i < x.length; i++) { const v = x[i]; if (!fin(v)) continue; if (!fin(p)) { s += v; c++; if (c === n) { p = s/n; o[i] = p; } } else { p = (p*(n-1)+v)/n; o[i] = p; } } return o; },
  wma(x, n) { const o = NaNs(x.length), d = n*(n+1)/2; for (let i = n-1; i < x.length; i++) { let s = 0; for (let j = 0; j < n; j++) s += x[i-j]*(n-j); o[i] = s/d; } return o; },
  std(x, n) { const o = NaNs(x.length); for (let i = n-1; i < x.length; i++) { let m = 0; for (let j = 0; j < n; j++) m += x[i-j]; m /= n; let v = 0; for (let j = 0; j < n; j++) v += (x[i-j]-m)**2; o[i] = Math.sqrt(v/n); } return o; },
  hh(x, n) { const o = NaNs(x.length); for (let i = n-1; i < x.length; i++) { let m = -Infinity; for (let j = 0; j < n; j++) m = Math.max(m, x[i-j]); o[i] = m; } return o; },
  ll(x, n) { const o = NaNs(x.length); for (let i = n-1; i < x.length; i++) { let m = Infinity; for (let j = 0; j < n; j++) m = Math.min(m, x[i-j]); o[i] = m; } return o; },
  tr(d) { return d.c.map((_, i) => i === 0 ? d.h[0]-d.l[0] : Math.max(d.h[i]-d.l[i], Math.abs(d.h[i]-d.c[i-1]), Math.abs(d.l[i]-d.c[i-1]))); },
  atr(d, n) { return TA.rma(TA.tr(d), n); },
  rsi(x, n) { const g = [0], l = [0]; for (let i = 1; i < x.length; i++) { const ch = x[i]-x[i-1]; g.push(Math.max(ch, 0)); l.push(Math.max(-ch, 0)); }
    const ag = TA.rma(g.slice(1), n), al = TA.rma(l.slice(1), n); return [NaN, ...ag.map((v, i) => al[i] === 0 ? 100 : 100 - 100/(1+v/al[i]))]; },
  sub(a, b) { return a.map((v, i) => v - b[i]); },
};
/* WLOSC-BEGIN: our own Prime-style oscillator; mirror of pionex_lab/waves/oscillator.py (parity-tested) */
const WLOSC = (() => {
  const fin = x => typeof x === "number" && isFinite(x), NA = n => new Array(n).fill(NaN);
  const DEFAULTS = {n1: 10, n2: 21, mfi: 14, mfs: 5, ob: 53, pivot: 5, lookback: 60, vwap: 50};
  const ema = (x, n) => { const o = NA(x.length), a = 2 / (n + 1); let p = NaN, s = 0, c = 0;
    for (let i = 0; i < x.length; i++) { const v = x[i]; if (!fin(v)) continue;
      if (!fin(p)) { s += v; c++; if (c === n) { p = s / n; o[i] = p; } } else { p = v * a + p * (1 - a); o[i] = p; } } return o; };
  const rma = (x, n) => { const o = NA(x.length); let p = NaN, s = 0, c = 0;
    for (let i = 0; i < x.length; i++) { const v = x[i]; if (!fin(v)) continue;
      if (!fin(p)) { s += v; c++; if (c === n) { p = s / n; o[i] = p; } } else { p = (p * (n - 1) + v) / n; o[i] = p; } } return o; };
  const sma = (x, n) => { const o = NA(x.length);
    for (let i = n - 1; i < x.length; i++) { let s = 0, ok = true; for (let j = 0; j < n; j++) { if (!fin(x[i-j])) { ok = false; break; } s += x[i-j]; } if (ok) o[i] = s / n; } return o; };
  function calc(o, h, l, c, v, params) {
    const p = Object.assign({}, DEFAULTS, params || {}), n = c.length;
    const ap = c.map((_, i) => (h[i] + l[i] + c[i]) / 3), esa = ema(ap, p.n1);
    const dd = ema(ap.map((x, i) => fin(esa[i]) ? Math.abs(x - esa[i]) : NaN), p.n1);
    const ci = ap.map((x, i) => !fin(dd[i]) ? NaN : dd[i] > 0 ? (x - esa[i]) / (0.015 * dd[i]) : 0);
    const wt1 = ema(ci, p.n2), wt2 = sma(wt1, 4), m = p.mfi, mfi = NA(n);
    for (let i = m; i < n; i++) { let pos = 0, neg = 0;
      for (let j = 0; j < m; j++) { const k = i - j, f = ap[k] * v[k]; if (ap[k] > ap[k-1]) pos += f; else if (ap[k] < ap[k-1]) neg += f; }
      mfi[i] = neg > 0 ? 100 - 100 / (1 + pos / neg) : pos > 0 ? 100 : 50; }

let audioCtx = null;
function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const t = audioCtx.currentTime;
  [0, 0.18, 0.36].forEach((d, k) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = [880, 1175, 1568][k]; g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.2, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.16); o.connect(g).connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 0.18); }); } catch (e) {} }
function toast(title, body) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<b>${esc(title)}</b>${esc(body)}`; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 12000); t.onclick = () => t.remove(); }
function fire(a, text) {
  const title = `⏰ ${a.symbol.replace("_", "/")} ${IV_LABEL[a.interval] || ""}`;
  if (a.popup) toast(title, text + (a.note ? ` (${a.note})` : ""));
  if (a.sound) beep();
  if (a.speak && "speechSynthesis" in window) { try { speechSynthesis.speak(new SpeechSynthesisUtterance(`${a.symbol.replace("_", " ")} alert. ${text}`)); } catch (e) {} }
  if (a.notify && "Notification" in window && Notification.permission === "granted") { try { new Notification(title, {body: text}); } catch (e) {} }
  if (a.symbol !== "TEST") { S.alertLog.push({at: Date.now(), text: `${a.symbol} ${IV_LABEL[a.interval]}: ${text}`}); S.alertLog = S.alertLog.slice(-200); store.set("alertLog", S.alertLog); }
}
async function checkAlerts() {
  const act = S.alerts.filter(a => a.active); if (!act.length) return;
  const syms = [...new Set(act.map(a => a.symbol))];
  let quotes = {}; try { quotes = (await api("/api/quotes?symbols=" + syms.join(","))).quotes; } catch (e) { return; }
  const anCache = {}; let fired = false;
  for (const a of act) {
    const q = quotes[a.symbol]; if (!q || !fin(q.last)) continue; const p = q.last; let msg = null;
    if (a.type === "above" || a.type === "below") {
      const side = p >= a.price ? "above" : "below";
      if (a.state && a.state !== side && side === a.type) msg = `price ${fmtP(p)} crossed ${a.type} ${fmtP(a.price)}`;
      if (!a.state && side === a.type) msg = `price ${fmtP(p)} is ${a.type} ${fmtP(a.price)}`;
      a.state = side;
    } else {
      const key = `${a.symbol}|${a.interval}|${a.degree}`;
      try { anCache[key] = anCache[key] || await api(`/api/analysis?symbol=${a.symbol}&interval=${a.interval}&degree=${a.degree || S.degree}&limit=500`); } catch (e) { continue; }
      const pr = anCache[key].primary; if (!pr) continue;
      const sig = `${pr.type}|${pr.waves[0].t}|${pr.current_wave}`;
      if (a.type === "wave") { if (a.state && a.state !== sig) msg = `wave count now: wave ${pr.current_wave} of ${pr.type} (${pr.direction}). ${pr.status}`; a.state = sig; }
      if (a.type === "target") { const hit = pr.targets.find(t => pr.move === "up" ? p >= t.price && (a.state == null || a.state < t.price) : p <= t.price && (a.state == null || a.state > t.price));
        if (hit && a.state != null) msg = `price ${fmtP(p)} reached ${(hit.ratio*100).toFixed(1)}% ${hit.kind} target ${fmtP(hit.price)} (wave ${pr.current_wave})`; a.state = p; }
      if (a.type === "invalid") { if (a.state && a.state.sig === sig && fin(a.state.inv) && (pr.trend === "up" ? p < a.state.inv : p > a.state.inv)) msg = `price ${fmtP(p)} broke invalidation ${fmtP(a.state.inv)} of the wave ${pr.current_wave} count`;
        a.state = {sig, inv: pr.invalidation}; }
    }
    if (msg) { fire(a, msg); a.firedAt = Date.now(); if (a.once) a.active = false; fired = true; }
  }
  store.set("alerts", S.alerts);
  if (fired) { renderAlerts(); redrawAll(); }
}

async function pollQuotes() {
  const syms = (S.lists[S.list] || []).slice(0, 40); if (!syms.length) return;
  try { const r = await api("/api/quotes?symbols=" + syms.join(",")); Object.assign(S.quotes, r.quotes); renderWatch(); } catch (e) { setStatus("Quotes failed: " + e.message); }
}
async function pollWaveCol() {
  const syms = (S.lists[S.list] || []).slice(0, 40); if (!syms.length) return;
  try { const r = await api(`/api/scan?symbols=${syms.join(",")}&intervals=60M&degree=${S.degree}`); r.rows.forEach(x => S.waveCol[x.symbol] = x); renderWatch(); } catch (e) {}
}
let tick = 0;
function startPolling(sec) {
  setInterval(() => {
    tick++;
    reloadAll(); pollQuotes(); checkAlerts();
    if (tick % 4 === 0) pollWaveCol();
    setStatus(`Updated ${new Date().toLocaleTimeString()} · refresh every ${sec}s`);
  }, sec * 1000);
}

/* ============================================================ init */
(async function init() {
  initHeader();
  try { S.meta = await api("/api/meta"); } catch (e) { setStatus("Server unreachable: " + e.message); return; }
  if (S.meta.hosted) { $("#shotBtn").hidden = true; document.documentElement.classList.add("hosted"); }
  const b = $("#feedBadge"); b.textContent = S.meta.feed_label; b.className = "badge " + (S.meta.feed === "demo" ? "demo" : "live");
  if (S.meta.fallback_reason) b.title = "Pionex unreachable: " + S.meta.fallback_reason;
  try { S.symbols = (await api("/api/symbols")).symbols; } catch (e) { S.symbols = []; }
  if (S.symbols.length && !S.symbols.includes(S.symbol)) S.symbol = S.symbols.includes("BTC_USDT") ? "BTC_USDT" : S.symbols[0];
  buildPanes(); showTab(S.tab);
  pollQuotes(); pollWaveCol();
  setStatus(`Ready · ${S.meta.feed_label}`);
  startPolling(S.meta.feed === "pionex" ? 15 : 10);
})();
</script>
</body>
